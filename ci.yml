# CI for Whisper — canonical WinDevKit workflow, adapted. Copy to
# .github/workflows/ci.yml. NOTE: the GitHub App cannot create/edit
# files under .github/workflows/ (no Workflows permission), so this
# file is always added through the GitHub web UI.
#
# Two adaptations from the canonical cargo-only workflow, both forced
# by the vendored engine:
#   1. A fetch step downloads the pinned whisper.cpp sources and the
#      test model (SHA-256 verified against pins.txt) — the build has
#      an engine only when vendor/src-whisper exists. On the Windows
#      runner the fetch runs through fetch.ps1 (PowerShell is the
#      default shell); fetch.sh is the POSIX twin (`sh ./fetch.sh`).
#   2. An explicitly-labeled e2e step runs the real transcription
#      proof: tiny.en model + the JFK sample, asserting the transcript
#      contains "fellow Americans". This is the step that proves the
#      Windows/MSVC link of whisper.cpp+ggml AND native transcription.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fetch pinned whisper.cpp sources + test model (SHA-256 verified)
        run: ./fetch.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: E2E transcription proof (real engine, tiny.en model, JFK sample)
        env:
          WS_E2E: "1"
          WS_MODEL: vendor/ggml-tiny.en.bin
          WS_SAMPLE: vendor/src-whisper/samples/jfk.wav
        run: cargo test --locked --test e2e -- --ignored --nocapture
      - run: cargo build --release --locked
